<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TripCraft</title>
<style id="tc-v68-responsive">
/* TripCraft V69: unified iPhone + Android responsive layer */
html{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{width:100%;max-width:100%;overflow-x:hidden;min-height:100vh;min-height:100svh;margin:0;}
*,*::before,*::after{box-sizing:border-box;}
img,svg,video,canvas{max-width:100%;height:auto;}
iframe{max-width:100%;}
input,select,textarea,button{max-width:100%;font-family:inherit;}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent;}
.tc-header,.top,.topbar,#tc-v67-bar{padding-top:max(10px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));}
.mobile-menu{height:100vh!important;height:100dvh!important;padding-bottom:max(18px,env(safe-area-inset-bottom))!important;}
footer{padding-bottom:max(24px,calc(env(safe-area-inset-bottom) + 18px));}
.wrap,.generated-body,.heroin,.generated-hero-in{max-width:100%;}
pre,code{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;}
table{max-width:100%;}
th,td{overflow-wrap:anywhere;word-break:normal;}

@media (max-width:980px){
  body{font-size:16px;}
  .tc-header,.top{min-height:68px;align-items:center!important;}
  .tc-header .brand,.top .brand{min-width:0;max-width:58vw;}
  .brand h1{font-size:clamp(20px,5vw,25px);white-space:nowrap;}
  .brand small{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;}
  .logo{flex:0 0 auto;}
  .hamburger{min-width:48px!important;min-height:48px!important;display:grid!important;place-items:center;}
  .lang-switch{max-width:112px;}
  .lang-switch button,.mobile-lang button{min-height:40px;}
  .btn,.open,.planner-actions button,.planner-actions .btn,#tc-v67-bar button{min-height:44px;}
  .panel{padding:16px;margin-top:20px;}
  .wrap{width:min(100%,96%);padding:20px 0 54px;}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .cover{height:150px;}
  .tripbody{padding:14px;}
  .headrow{align-items:flex-start;flex-direction:column;}
  .formgrid,.statusgrid{grid-template-columns:1fr!important;}
  .day-card,.day-row{grid-template-columns:72px 1fr!important;}
  .day-card .photo,.day-photo{display:none!important;}
  .day-card .go,.day-action{grid-column:1/-1!important;padding-top:0;}
  .stopcard,.stop{grid-template-columns:1fr!important;}
  .backbar{top:68px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));}
  .generated-hero,.hero{min-height:240px;}
  .generated-hero-in{padding:28px 0;}
  .preview-hero{min-height:210px;padding:18px;}
  .planner-panel{scroll-margin-top:76px;}
  .planner-grid{grid-template-columns:1fr!important;}
  .journey-row,.dates-row,.quick-plan-card{grid-template-columns:1fr!important;}
  .journey-arrow{display:none!important;}
  .v59-topic{grid-template-columns:1fr!important;padding:14px!important;}
  .v59-topic-title{border-left:0!important;border-bottom:1px solid rgba(30,72,96,.12);padding:0 0 10px!important;}
  .country-chips,.country-popular,.selected-countries{display:flex!important;flex-wrap:wrap!important;gap:8px!important;}
  .country-chips span,.country-popular span,.selected-country{flex:0 0 auto;}
  .prehotel-head,.prehotel-card{align-items:stretch!important;flex-direction:column!important;}
  .prehotel-price{text-align:right!important;}
  .prehotel-actions>*{flex:1 1 140px;}
  .topbar{flex-wrap:wrap;}
  .navlinks{max-width:100%;overflow-x:auto;flex-wrap:nowrap!important;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .navlinks::-webkit-scrollbar{display:none;}
  .map{height:min(58vh,380px)!important;}
  .stats,.summarygrid,.costgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
  .daygrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
}

@media (max-width:600px){
  body{font-size:16px;}
  input,select,textarea{font-size:16px!important;min-height:44px;}
  button,.btn,.open,a.open{font-size:15px;}
  .tc-header,.top{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));}
  .tc-header .brand,.top .brand{max-width:54vw;gap:8px;}
  .logo{width:44px;height:44px;border-radius:13px;font-size:24px;}
  .hamburger{right:max(8px,env(safe-area-inset-right))!important;top:max(10px,env(safe-area-inset-top))!important;}
  .lang-switch{left:max(8px,env(safe-area-inset-left))!important;top:max(12px,env(safe-area-inset-top))!important;}
  .hero h2,.generated-hero h1{font-size:clamp(30px,10vw,44px)!important;}
  .hero p,.generated-hero p{font-size:16px;}
  .wrap{width:calc(100% - 20px);padding:14px 0 44px;}
  .cards{grid-template-columns:1fr;gap:12px;}
  .trip{border-radius:17px;}
  .cover{height:145px;}
  .headrow h2{font-size:28px;}
  .panel{padding:13px;border-radius:17px;}
  .uploadbox{padding:16px;}
  .planner-step h3{font-size:22px!important;margin-bottom:12px;}
  .planner-step:not([data-step="1"]){padding:13px!important;border-radius:17px;}
  .planner-actions{position:sticky;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 0 max(10px,env(safe-area-inset-bottom));margin-top:10px;}
  .planner-actions .btn{min-width:0!important;flex:1 1 0!important;}
  .country-chips,.country-popular{gap:6px!important;}
  .country-chips span,.country-popular span,.selected-country{font-size:13px!important;padding:8px 10px!important;}
  .country-add,.country-search-row{flex-direction:column!important;}
  .same-airport-check{width:100%;align-items:center;}
  .same-airport-check input{width:22px!important;height:22px!important;min-height:22px!important;}
  .day-card,.day-row{grid-template-columns:58px 1fr!important;border-radius:16px;}
  .day-card .num strong,.day-no b{font-size:27px!important;}
  .day-card .info,.day-main{padding:13px;}
  .day-card h3,.day-main h3{font-size:19px;}
  .detail-head{padding:16px;border-radius:17px;}
  .detail-head h2{font-size:26px;}
  .generated-body{width:calc(100% - 20px);padding:18px 0 44px;}
  .overview-box{padding:14px;border-radius:17px;}
  .stopcard,.stop{padding:13px;border-radius:16px;}
  .navbuttons a,.mapsrow a{flex:1 1 130px;justify-content:center;text-align:center;}
  .topbar{padding:10px 12px;}
  .brand{font-size:16px;}
  .navlinks a,.topbar a{padding:8px 10px;white-space:nowrap;}
  .wrap{padding-left:0;padding-right:0;}
  .hero{padding:18px!important;border-radius:18px!important;}
  .stats,.summarygrid,.costgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;}
  .stat,.summarycard,.costitem{padding:10px!important;}
  .daygrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;}
  .daybtn{min-width:0;min-height:96px!important;padding:10px!important;}
  .daybtn b{font-size:15px!important;overflow-wrap:anywhere;}
  .hotel-table{font-size:13px;table-layout:fixed;}
  .hotel-table th,.hotel-table td{padding:7px!important;}
  #tc-v67-bar{padding-bottom:9px;flex-wrap:wrap;}
  #tc-v67-bar .tc-home{font-size:15px;max-width:62vw;overflow:hidden;text-overflow:ellipsis;}
  #tc-v67-bar button{min-height:40px;padding:8px 11px;}
}

@media (max-width:390px){
  .brand h1{font-size:20px;}
  .brand small{font-size:10px;}
  .lang-switch{transform:scale(.92);transform-origin:left center;}
  .cards{grid-template-columns:1fr;}
  .stats,.summarygrid,.costgrid{grid-template-columns:1fr 1fr!important;}
  .daygrid{grid-template-columns:1fr!important;}
  .planner-actions{gap:6px!important;}
  .planner-actions .btn{padding:10px 9px!important;font-size:14px!important;}
}

/* Android Chrome & iOS Safari dynamic browser chrome support */
@supports(height:100dvh){.mobile-menu{height:100dvh!important;}}
@supports(padding:max(0px)){body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}}
</style>

</head><body><style id="tc-v67-nav">
#tc-v67-bar{position:sticky;top:0;z-index:100000;background:#0d3557;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;direction:rtl;box-shadow:0 2px 10px rgba(0,0,0,.18)}#tc-v67-bar .tc-home{color:#fff;text-decoration:none;font-weight:900;font-size:17px;white-space:nowrap}#tc-v67-bar button{border:0;background:#fff;color:#0d3557;border-radius:11px;padding:9px 15px;font:inherit;font-weight:900;cursor:pointer;white-space:nowrap}@media(max-width:600px){#tc-v67-bar{padding:9px 10px}#tc-v67-bar .tc-home{font-size:15px}#tc-v67-bar button{padding:8px 12px}}
</style><div id="tc-v67-bar"><a class="tc-home" href="index.html" aria-label="דף הבית">TripCraft</a><button type="button" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">← חזרה</button></div><script>
(function(){
 const p=location.pathname; const m=p.match(/\/tripcraft-app-test\/(slovakia|vietnam|greece|dolomites|tyrol|usa)(?:\/index\.html)?$/i);
 if(m){ location.replace('/tripcraft-app-test/trips/'+m[1].toLowerCase()+'/index.html'+location.search+location.hash); return; }
 location.replace('/tripcraft-app-test/'+(location.hash||''));
})();
</script></body></html>
