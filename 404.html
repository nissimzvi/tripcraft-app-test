<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripCraft</title></head><body><script>
(function(){
 const p=location.pathname; const m=p.match(/\/tripcraft-app-test\/(slovakia|vietnam|greece|dolomites|tyrol|usa)(?:\/index\.html)?$/i);
 if(m){ location.replace('/tripcraft-app-test/trips/'+m[1].toLowerCase()+'/index.html'+location.search+location.hash); return; }
 location.replace('/tripcraft-app-test/'+(location.hash||''));
})();
</script></body></html>
