<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const days=[{"date":"16.10","title":"נחיתה · קורינתוס · לוטראקי","hotel":"Club Hotel Casino Loutraki","stops":[["Athens International Airport","נחיתה באתונה, איסוף המזוודות ורכב השכור. לפני היציאה כדאי לוודא מצב דלק, לצלם את הרכב מכל הצדדים ולפתוח את מסלול היום ב-Waze.","45–75 דק׳","ללא עלות כניסה",37.9364,23.9445],["Corinth Canal – exact viewpoint","עצירה על הגשר מעל תעלת קורינתוס - חריץ צר ועמוק שנחצב בין היבשת לפלופונס. מהמעקה רואים את קירות הסלע הכמעט אנכיים ואת הספינות הקטנות החולפות עמוק למטה; זו עצירת צילום קצרה ומרשימה.","30–40 דק׳","חינם",37.934219,22.984368],["Club Hotel Casino Loutraki","צ׳ק-אין ומנוחה אחרי הטיסה. המלון נמצא על קו החוף של לוטראקי, כך שאפשר להשאיר כאן את הרכב ולצאת בהמשך לטיילת ברגל.","45–60 דק׳","—",37.96118,22.96927],["Loutraki Beach Park","טיילת נעימה על קו הים עם בתי קפה, מסעדות ונוף למפרץ קורינתוס. זה המקום להיכנס לאווירת החופשה, ללכת בנחת לאורך המים ולבחור מקום לארוחת ערב.","1.5–2 שעות","חינם",37.9768,22.9776]]},{"date":"17.10","title":"לוטראקי · נפפקטוס · יואנינה","hotel":"The Lake Hotel","stops":[["Club Hotel Casino Loutraki","יציאה מהמלון צפונה.","—","—",37.96118,22.96927],["Nafpaktos Venetian Port","נמל ונציאני קטן ויפהפה שמוקף חומות ומגדלים עתיקים. מטיילים סביב הנמל, עולים מעט לכיוון הרחובות הישנים, מצלמים את המבצר והסירות ועוצרים לקפה או ארוחת צהריים על המים.","60–75 דק׳","חניה/אוכל",38.3915,21.8271],["Rio–Antirrio Bridge","מעבר על גשר ריו-אנטיריו, אחד מסמלי ההנדסה המודרנית של יוון. בזמן החצייה נפתחים נופים רחבים של המפרץ וההרים משני הצדדים; אין צורך בביקור ארוך, העיקר ליהנות מהמעבר ומהתצפית.","20–25 דק׳","אגרת כביש",38.3204,21.7728],["The Lake Hotel","צ׳ק־אין ומנוחה קצרה.","45–60 דק׳","—",39.6888,20.8525]]},{"date":"18.10","title":"קניון ויקוס וגשרי זגוריה","hotel":"The Lake Hotel","stops":[["The Lake Hotel","יציאה ליום הטבע.","—","—",39.6888,20.8525],["Monodendri Zagori","כפר אבן קלאסי של זגוריה עם גגות צפחה, סמטאות צרות וכיכר מוצלת. כדאי לשוטט מעט בין הבתים, לשתות קפה בכיכר ולהרגיש את האופי ההררי לפני שממשיכים לתצפיות הקניון.","60–75 דק׳","חינם",39.881,20.7465],["Oxya Viewpoint","אחת התצפיות המרשימות ביותר על קניון ויקוס. מהשביל הקצר מגיעים לשפת המצוק ורואים את הקניון העמוק, קירות הסלע וההרים סביב - נקודה מצוינת לצילום, במיוחד ביום בהיר.","45–60 דק׳","חינם",39.9088,20.7047],["Stone Forest Zagori","אזור יוצא דופן של שכבות סלע טבעיות שנראות כמו ערימות לוחות אבן או יער מאובן. עושים עצירה קצרה, הולכים בין התצורות ומקבלים נוף שונה לגמרי מכל שאר היום.","30–45 דק׳","חינם",39.8925,20.731],["Kokkoris Bridge Zagori","גשר אבן עות׳מאני חד-קשתי, מהיפים באזור זגוריה. אפשר לרדת מהכביש לשביל קצר אל בסיס הגשר, לראות מקרוב את הקשת מעל הערוץ ולהצטלם ליד המים אם הזרימה מאפשרת.","45–60 דק׳","חינם",39.839,20.7856],["Kipoi Zagori","כפר קטן ונעים לעצירת צהריים.","60–75 דק׳","לפי הזמנה",39.859,20.793],["Plakidas Bridge Zagori","גשר האבן Plakidas בעל שלוש הקשתות, אחד מסמלי זגוריה. ההליכה אליו קצרה ונוחה יחסית, והמבנה משתלב יפה בנוף הירוק ובערוץ שמתחתיו.","45–60 דק׳","חינם",39.8548,20.7874],["The Lake Hotel","חזרה למלון.","—","—",39.6888,20.8525]]},{"date":"19.10","title":"קוניצה · וידומאטיס · פפיגו","hotel":"The Lake Hotel","stops":[["The Lake Hotel","יציאה צפונה.","—","—",39.6888,20.8525],["Konitsa Bridge","גשר האבן הגדול של קוניצה ניצב מעל נהר אאוס בפתח קניון מרשים. אפשר ללכת מעט לאורך הנהר, לראות את הקשת הענקית מקרוב וליהנות מנוף הררי שונה מהיום הקודם.","45–60 דק׳","חינם",40.0495,20.741],["Kleidonia Bridge Voidomatis","נקודה נהדרת לפגוש את נהר וידומאטיס, הידוע במים הצלולים ובצבעי הטורקיז-ירוק שלו. הולכים מעט ליד הגשר והנהר, מצלמים את המים והיער ונהנים מעצירת טבע רגועה.","45–60 דק׳","חינם",39.968,20.664],["Aristi Zagori","כפר אבן לקפה או ארוחה קלה.","45–60 דק׳","לפי הזמנה",39.934,20.673],["Papingo Rock Pools","בריכות סלע טבעיות שנוצרו לאורך ערוץ רוגובו בין פפיגו למיקרו פפיגו. הולכים בזהירות על הסלע ורואים שקעים ובריכות קטנות עם מים צלולים; באוקטובר זו בעיקר עצירת נוף ולא רחצה.","45–60 דק׳","חינם",39.968,20.718],["Megalo Papigo","כפר האבן המרכזי של פפיגו, מוקף בפסגות האסטרקה המרשימות. שווה ללכת בסמטאות, לראות את הבתים העתיקים, לשבת בכיכר ולאכול משהו מול נוף הרים דרמטי.","75–90 דק׳","לפי הזמנה",39.967,20.717],["Mikro Papigo","כפר קטן ושקט בקצה הדרך.","30–45 דק׳","חינם",39.9725,20.727],["The Lake Hotel","חזרה ליואנינה.","—","—",39.6888,20.8525]]},{"date":"20.10","title":"יואנינה · מצובו · מטאורה","hotel":"Hotel Doupiani House","stops":[["The Lake Hotel","יציאה מהמלון.","—","—",39.6888,20.8525],["Perama Cave Ioannina","מערת פראמה היא מערכת גדולה של אולמות, נטיפים וזקיפים שהתפתחה במשך מיליוני שנים. הביקור נעשה בסיור מודרך ובמסלול עם מדרגות, כך שכדאי להגיע עם נעליים נוחות.","75–90 דק׳","לפי תעריף",39.696,20.846],["Metsovo Central Square","מצובו היא עיירת הרים אלפינית עם בתי אבן, כיכר יפה, חנויות גבינות ומוצרים מקומיים. זה מקום מצוין לעצירת צהריים, סיבוב קצר ברחובות ותצפית על ההרים לפני הירידה למטאורה.","1.5–2 שעות","חניה/אוכל",39.7702,21.1822],["Hotel Doupiani House","צ׳ק־אין מול צוקי מטאורה.","45–60 דק׳","—",39.7161,21.618],["Meteora Observation Deck","נסיעה נופית בין עמודי הסלע האדירים של מטאורה. עוצרים בכמה מפרצי תצפית ורואים מנזרים שנראים כאילו הם תלויים על קצות הצוקים - אחד משיאי הטיול.","1.5–2 שעות","חינם",39.7215,21.633],["Meteora Sunset Viewpoint","נקודת שקיעה רחבה מעל מטאורה, שבה האור האחרון נופל על עמודי הסלע והמנזרים. להגיע מעט לפני השקיעה כדי לתפוס מקום ולראות את הצבעים משתנים על כל העמק.","45–60 דק׳","חינם",39.722,21.6308]]},{"date":"21.10","title":"מנזרי מטאורה · וולוס","hotel":"Domotel Xenia Volos","stops":[["Hotel Doupiani House","יציאה למנזרים.","—","—",39.7161,21.618],["Great Meteoron Monastery","המנזר הגדול והחשוב במטאורה, בנוי גבוה על סלע עצום. בפנים רואים כנסייה עתיקה, חצרות, מוזיאון וחדרים היסטוריים, ובחוץ תצפיות מרשימות על העמק והמנזרים האחרים.","75–90 דק׳","כרטיס/תרומה",39.725,21.6266],["Varlaam Monastery","מנזר ורלאם יושב על צוק סמוך ל-Great Meteoron ומציע שילוב יפה של כנסייה, ציורי קיר ותצפיות. הוא מעט קומפקטי יותר ולכן נוח לשלב אותו באותו בוקר.","60–75 דק׳","כרטיס/תרומה", const enc=s=>encodeURIComponent(s);const g=(lat,lng)=>`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;const w=(lat,lng)=>`https://www.waze.com/ul?ll=${lat},${lng}&navigate=yes`;
function dailyRoute(stops){const p=stops.map(s=>`${s[4]},${s[5]}`);let u=`https://www.google.com/maps/dir/?api=1&origin=${p[0]}&destination=${p[p.length-1]}&travelmode=driving`;if(p.length>2)u+=`&waypoints=${encodeURIComponent(p.slice(1,-1).join('|'))}`;return u}
let current=0,dayMap=null,overviewMap=null;
function makeMap(el,stops,fit=true){const m=L.map(el,{scrollWheelZoom:false});L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap'}).addTo(m);const pts=stops.map(x=>[x[4],x[5]]);pts.forEach((p,i)=>L.marker(p).addTo(m).bindPopup(`<b>${i+1}. ${stops[i][0]}</b>`));L.polyline(pts,{weight:5,opacity:.85,color:'#e14b87'}).addTo(m);if(fit)m.fitBounds(pts,{padding:[35,35]});return m}
function renderNav(){const n=document.getElementById('day-nav');n.innerHTML=days.map((d,i)=>`<button class="day-btn ${i===current?'active':''}" data-i="${i}">יום ${i+1}<br><small>${d.date}</small></button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>showDay(+b.dataset.i))}
function cityBlock(d){const c=cityPlans[d.date];if(!c)return '';return `<section class="city-plan"><div class="city-title">🌙 ${c.title}</div><p><b>🚗 חניה:</b> ${c.parking}</p><p>${c.text}</p><div class="actions city-actions">${c.waze?`<a class="waze" target="_blank" href="${c.waze}">🚙 Waze לחניה</a>`:''}<a class="walk" target="_blank" href="${c.walk}">🚶 Google Maps – מסלול ברגל</a></div></section>`}
function showDay(i){current=i;['overview','hotels'].forEach(id=>document.getElementById(id).classList.add('hidden'));const d=days[i],v=document.getElementById('day-view');v.classList.remove('hidden');v.innerHTML=`<div class="day-hero"><div class="date">יום ${i+1} · ${d.date}.2026</div><h2>${d.title}</h2><p>לינה: <b>${d.hotel}</b></p><a class="full-route" target="_blank" href="${dailyRoute(d.stops)}">🗺️ פתח את כל מסלול היום ב-Google Maps</a></div><div class="map-title">מפת היום – כל הנקודות מחוברות לפי סדר הנסיעה</div><div id="day-map" class="map day-map"></div>${cityBlock(d)}<div class="stops">${d.stops.map((s,j)=>`<article class="stop"><div class="num">${j+1}</div><div><h3>${s[0]}</h3><p>${s[1]}</p><div class="meta"><span class="tag">⏱ ${s[2]}</span><span class="tag">💶 ${s[3]}</span></div><div class="actions"><a class="google" target="_blank" href="${g(s[4],s[5])}">📍 Google Maps</a><a class="waze" target="_blank" href="${w(s[4],s[5])}">🚙 Waze לנקודה</a>${j<d.stops.length-1?`<a class="next-waze" target="_blank" href="${w(d.stops[j+1][4],d.stops[j+1][5])}">➡️ Waze לנקודה הבאה: ${d.stops[j+1][0]}</a>`:''}</div></div></article>`).join('')}</div><div class="nextbox">🏨 <b>סיום היום:</b> ${d.hotel}</div><div class="day-switch"><button id="prev" ${i===0?'disabled':''}>→ היום הקודם</button><button id="next" ${i===days.length-1?'disabled':''}>היום הבא ←</button></div>`;renderNav();setTimeout(()=>{if(dayMap)dayMap.remove();dayMap=makeMap('day-map',d.stops)},30);document.getElementById('prev').onclick=()=>i>0&&showDay(i-1);document.getElementById('next').onclick=()=>i<days.length-1&&showDay(i+1)}
function showOverview(){document.getElementById('day-view').classList.add('hidden');document.getElementById('hotels').classList.add('hidden');document.getElementById('overview').classList.remove('hidden');if(!overviewMap)setTimeout(()=>{const s=days.map(d=>d.stops[0]).concat([days[days.length-1].stops.at(-1)]);overviewMap=makeMap('overview-map',s)},30)}
function showHotels(){document.getElementById('day-view').classList.add('hidden');document.getElementById('overview').classList.add('hidden');const h=document.getElementById('hotels');h.classList.remove('hidden');document.getElementById('hotel-grid').innerHTML=hotels.map(x=>`<div class="hotel"><div class="dates">${x[0]}</div><h3>${x[1]}</h3><a target="_blank" href="https://www.waze.com/ul?q=${enc(x[1])}&navigate=yes">🚙 Waze למלון</a></div>`).join('')}
document.getElementById('overviewBtn').onclick=showOverview;document.getElementById('hotelsBtn').onclick=showHotels;renderNav();showDay(0);
</script>
</body></html>
